[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portlab"
version = "0.2.2"
description = "Portfolio analysis toolkit: risk measurement and VaR backtesting, optimization, Monte Carlo simulation, factor models, tax-aware portfolio management, and daily risk monitoring, with a documented validation record."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ibrahim Oyeyinka" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "plotly>=5.15",
]
keywords = ["portfolio", "risk", "var", "backtesting", "optimization", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
opt = ["cvxpy>=1.4"]
data = ["yfinance>=0.2.40", "pandas-datareader>=0.10", "pyarrow>=14"]
test = ["pytest>=7", "arch"]

[project.urls]
Homepage = "https://github.com/Realosunboy6/portlab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
